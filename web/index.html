<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NovelWriter Agent</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>NovelWriter Agent</h1>
        <p id="health">正在连接本地智能体...</p>
      </div>
      <button id="refreshProjects" type="button">刷新项目</button>
    </header>

    <main class="layout">
      <section class="panel creator">
        <h2>创建小说项目</h2>
        <form id="projectForm">
          <label>
            小说标题
            <input name="title" value="霓虹回声 Web 版" required />
          </label>
          <label>
            题材
            <input name="genre" value="赛博朋克悬疑" required />
          </label>
          <label>
            主角
            <textarea name="protagonist" rows="3" required>失去部分记忆的城市调查员林澈</textarea>
          </label>
          <label>
            风格
            <textarea name="style" rows="3" required>网文节奏，悬疑推进，画面感强</textarea>
          </label>
          <label>
            章节数量
            <input name="chapter_count" type="number" min="1" max="300" value="12" required />
          </label>
          <label>
            每章目标字数
            <input name="chapter_word_count" type="number" min="300" max="20000" step="100" value="3000" required />
          </label>
          <button type="submit">创建项目</button>
        </form>
      </section>

      <section class="panel workspace">
        <div class="section-title">
          <div>
            <h2>项目工作台</h2>
            <p id="activeProject">未选择项目</p>
          </div>
          <select id="projectSelect" aria-label="选择项目"></select>
        </div>

        <div class="actions">
          <button data-generate="setting" type="button">生成设定</button>
          <button data-generate="characters" type="button">生成人物</button>
          <button data-generate="world" type="button">生成世界观</button>
          <button data-generate="outline" type="button">生成大纲</button>
          <button data-generate="first_chapter" type="button">生成第一章</button>
          <button id="generateNextChapter" type="button">生成下一章</button>
          <button id="initializeProject" type="button">一键初始化</button>
          <button id="exportNovel" type="button">导出 Markdown</button>
        </div>

        <div class="content-grid">
          <section>
            <h3>生成结果</h3>
            <pre id="output">等待操作...</pre>
            <details id="debugPanel" class="debug-panel">
              <summary>后台记忆/调试信息</summary>
              <pre id="debugOutput">暂无调试信息。</pre>
            </details>
          </section>
          <section>
            <h3>章节</h3>
            <div id="chapters" class="chapter-list"></div>
          </section>
        </div>

        <section class="reader">
          <h3 id="chapterTitle">编辑章节正文</h3>
          <textarea id="chapterEditor" rows="18" aria-label="编辑章节">选择或生成章节后在这里查看。</textarea>
          <div class="chapter-actions">
            <button id="saveChapter" type="button">保存修改</button>
            <button id="continueChapter" type="button">续写章节</button>
            <button id="rewriteChapter" type="button">重写章节</button>
            <button id="deleteChapter" class="danger" type="button">删除章节</button>
          </div>
          <label class="instruction">
            重写要求
            <input id="rewriteInstruction" value="加强冲突、减少解释、保持原有剧情事实" />
          </label>
        </section>

        <section class="reference">
          <h3>参考文本 / 改编辅助</h3>
          <p class="notice">
            只能上传自己有权使用的文本、公版文本，或用于合法分析的片段。不要要求系统直接复制、洗稿或照搬受版权保护作品。系统只提取结构、节奏、人物关系、主题和写作技巧，输出必须是原创内容。
          </p>
          <label>
            参考说明
            <input id="referenceNote" value="想参考节奏、人物关系、世界观复杂度、悬疑结构" />
          </label>
          <label>
            参考文本
            <textarea id="referenceText" rows="8" placeholder="在这里粘贴可合法分析的参考文本片段"></textarea>
          </label>
          <div class="chapter-actions">
            <button id="saveReference" type="button">保存参考文本</button>
            <button id="analyzeReference" type="button">分析参考文本</button>
          </div>
        </section>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
